services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: targetlayer-frontend:latest
    container_name: targetlayer-frontend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8001}
    ports:
      - "${FRONTEND_HTTP_PORT:-8080}:80"
